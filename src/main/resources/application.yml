server:
  port: 8080

spring:
  application:
    name: notification-worker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:notification}
    username: ${DB_USER:notification}
    password: ${DB_PASSWORD:notification}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

notification:
  max-attempts: ${NOTIFICATION_MAX_ATTEMPTS:3}
  retry:
    initial-backoff-ms: ${NOTIFICATION_RETRY_INITIAL_MS:1000}
    multiplier: ${NOTIFICATION_RETRY_MULTIPLIER:2.0}
    max-backoff-ms: ${NOTIFICATION_RETRY_MAX_MS:30000}
  roles:
    api: ${NOTIFICATION_ROLE_API:true}
    worker: ${NOTIFICATION_ROLE_WORKER:true}
  outbox:
    poll-interval-ms: ${NOTIFICATION_OUTBOX_POLL_MS:200}
    batch-size: ${NOTIFICATION_OUTBOX_BATCH_SIZE:50}
  email:
    provider: ${NOTIFICATION_EMAIL_PROVIDER:logging}
    from: ${NOTIFICATION_EMAIL_FROM:noreply@example.com}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.satyam.notificationworker: INFO
